name: CI
on:
  push:
    branches: [main, 'arena/*']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit || true  # TODO: enforce after strict pass
      - run: npm run test
      - run: npm run build
        env:
          SESSION_SECRET: ci-test-secret-32chars-long-enough-for-ci
          DATABASE_URL: '' # file fallback in CI; prod uses Postgres
