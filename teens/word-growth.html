<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word &amp; Growth | CE Central 3 Teens</title>
  <meta name="description" content="Searchable library of Bible teachings and interactive Bible Challenge Arena for CE Central 3 Teens.">
  <meta name="theme-color" content="#101126">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/teens.css">
</head>
<body data-page="word-growth">
  <div data-teens-header></div>
  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Word &amp; Growth</span>
        <h1>Bible Teachings for <span class="gradient-text">Your Generation</span></h1>
        <p class="lead">Explore practical, Scripture-rooted studies on identity, faith, prayer, the Holy Spirit, purpose, excellence, relationships, and leadership.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filter-bar">
          <input class="input" style="max-width:320px;" type="search" placeholder="Search teachings or scriptures..." data-teaching-search>
          <div style="display:flex;flex-wrap:wrap;gap:0.5rem;" data-teaching-filters></div>
        </div>
        <div class="grid-2" data-teachings-grid></div>
      </div>
    </section>

    <section class="section section--alt">
      <div class="container" style="max-width:760px;">
        <span class="eyebrow">Bible Challenge Arena</span>
        <h2>Test Your Word Knowledge</h2>
        <p>Answer 8 questions across Easy, Medium, and Hard levels.</p>
        <div data-teens-quiz style="margin-top:1.5rem;"></div>
      </div>
    </section>
  </main>
  <div data-teens-footer></div>
  <script src="js/teens.js"></script>
</body>
</html>
