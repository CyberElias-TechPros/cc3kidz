<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Devotionals | CE Central 3 Teens</title>
  <meta name="description" content="Daily Bible devotionals and personal devotional tracker for CE Central 3 Teens.">
  <meta name="theme-color" content="#101126">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/teens.css">
</head>
<body data-page="devotionals">
  <div data-teens-header></div>
  <main>
    <section class="page-hero">
      <div class="container section-head" style="margin-bottom:0;">
        <div>
          <span class="eyebrow">Daily Devotionals</span>
          <h1>Feed Your Spirit <span class="gradient-text">Every Day</span></h1>
          <p class="lead">Short, powerful daily devotions with practical application and prayer. Track your progress locally on your device.</p>
        </div>
        <div class="card" style="padding:0.9rem 1.25rem;">
          <strong style="color:var(--lime);" data-devotional-count>0 of 5 completed</strong>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container grid-2" data-devotionals-list></div>
    </section>
  </main>
  <div data-teens-footer></div>
  <script src="js/teens.js"></script>
</body>
</html>
